[project]
name = "jev-review-gate"
version = "1.1.0"
description = "GitHub Actions gate that asks TypeSafe Jev before a protected job runs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Roman" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/RomanXSad/jev-review-gate"
Repository = "https://github.com/RomanXSad/jev-review-gate"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
